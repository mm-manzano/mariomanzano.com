<header class="header">
  <div class="header_inner">

    <!-- LEFT: name + About -->
    <div class="logo_block">
      {{- partial "logo.html" . }}

      <div class="about_link">
        {{ range .Site.Menus.main }}
          {{ if eq .Identifier "aboutme" }}
            <a href="{{ .URL }}">{{ .Name }}</a>
          {{ end }}
        {{ end }}
      </div>
    </div>

    <!-- CENTER: Seller Guide -->
    <div class="seller_center">
      {{ range .Site.Menus.main }}
        {{ if eq .Name "Seller Guide" }}
          <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      {{ end }}
    </div>

    <!-- RIGHT: theme toggle -->
    <div class="theme_toggle">
      {{ partial "theme-toggle.html" . }}
    </div>

  </div>
</header>
